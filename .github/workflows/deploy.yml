name: Deploy package

on:
  push:
    branches:
      - main

jobs:
  build-release-artifact:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package deploy bundle
        run: |
          mkdir -p dist
          zip -r dist/legendary-octo-parakeet.zip . \
            -x "data/*" \
            -x ".git/*" \
            -x ".github/workflows/*" \
            -x "archive/*" \
            -x "archive/**/*" \
            -x ".env*" \
            -x "**/server.out.log" \
            -x "**/server.err.log" \
            -x "*.docx" \
            -x "outputs/scratch/docx-probe/*"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: proposal-microsite-release
          path: dist/legendary-octo-parakeet.zip
          retention-days: 30
