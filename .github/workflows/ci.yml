name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies (if any)
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Start server and smoke test API
        run: |
          nohup node server.js > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          echo "Waiting for server..."
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/proposals >/dev/null 2>&1; then
              echo "Server is healthy"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Server did not become available"
              cat /tmp/server.log
              kill $SERVER_PID || true
              exit 1
            fi
            sleep 1
          done
          kill $SERVER_PID
