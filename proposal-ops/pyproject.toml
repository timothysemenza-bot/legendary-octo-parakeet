[project]
name = "bosskey-pursuit-os"
version = "0.1.0"
description = "Boss Key Pursuit OS - local-first proposal operations platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.2",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.9",
  "pypdf>=5.0.0",
  "python-docx>=1.1.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
