{% extends "base.html" %}
{% block content %}
<section>
  <h2>Sign In (OIDC Stub)</h2>
  {% if current_user %}
  <p>Signed in as <strong>{{ current_user.display_name }}</strong> ({{ current_user.email }})</p>
  {% else %}
  <p>Enter your identity claims to simulate OIDC login.</p>
  {% endif %}
  <form method="post" action="/auth/login">
    <label>Email <input type="email" name="email" required /></label>
    <label>Display Name (optional) <input name="display_name" /></label>
    <button type="submit">Sign In</button>
  </form>
</section>
{% endblock %}
