version: "3.9"

services:
  proposal-microsite:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - PUBLIC_DIR=.
      - PROPOSAL_DATA_DIR=/app/data
      - LIBRARY_FILE=/app/data/content-library.json
    volumes:
      - proposal-data:/app/data

volumes:
  proposal-data:
