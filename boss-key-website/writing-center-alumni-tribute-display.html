<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Margie Tribute Reception Display</title>
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <link rel="icon" type="image/svg+xml" href="./assets/logos/brand/boss-key-logo-refined.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#f8f3ea;--soft:#d6d2ca;--muted:#b4ada2;--navy:#112337;--maroon:#8f1932;--gold:#d6a359;--glass:rgba(11,20,30,.72);--line:rgba(255,255,255,.12)}
    *{box-sizing:border-box}html,body{margin:0;padding:0;height:100%;overflow:hidden;background:radial-gradient(circle at 18% 0%,rgba(214,163,89,.24) 0%,rgba(214,163,89,0) 22%),radial-gradient(circle at 100% 18%,rgba(143,25,50,.2) 0%,rgba(143,25,50,0) 28%),linear-gradient(140deg,#15283c 0%,#0d1722 48%,#07111a 100%);color:var(--ink);font-family:"Manrope","Segoe UI",sans-serif}
    .screen{display:grid;grid-template-rows:auto 1fr auto;height:100%;padding:26px 28px 20px}.top,.bottom,.brand-group{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand-group{justify-content:flex-start;flex-wrap:wrap}.brand,.counter,.hint,.partner-lockup{display:inline-flex;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.06);backdrop-filter:blur(14px)}
    .brand{font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#f7deb2}.counter{font-size:.95rem;color:var(--soft)}.hint{font-size:.88rem;color:var(--muted)}
    .partner-lockup{padding:8px 12px;border-radius:20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.partner-badge{display:flex;align-items:center;justify-content:center;min-height:60px;padding:10px 14px;border-radius:16px;border:1px solid rgba(255,255,255,.08)}.partner-badge img{display:block;height:auto}.wc-badge{background:linear-gradient(135deg,#0394c9 0%,#027aa8 100%)}.wc-badge img{width:min(150px,24vw)}.bk-badge{background:#09121d;padding:0;border-color:rgba(255,255,255,.04);overflow:hidden}.bk-badge img{width:min(220px,30vw)}.partner-x{font-family:"Fraunces",Georgia,serif;font-size:1.5rem;font-weight:700;color:#f7deb2;padding:0 2px}
    .stage{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:28px;align-items:center;min-height:0}
    .visual,.copy{position:relative;z-index:1}.frame,.copy-card{border:1px solid var(--line);border-radius:34px;background:var(--glass);backdrop-filter:blur(18px);box-shadow:0 30px 60px rgba(0,0,0,.28)}
    .frame{padding:18px;display:flex;align-items:center;justify-content:center;min-height:68vh}.portrait{width:min(100%,560px);aspect-ratio:4/5;object-fit:cover;border-radius:26px;border:1px solid rgba(255,255,255,.1);background:#1a2633}
    .portrait-placeholder{width:min(100%,560px);aspect-ratio:4/5;border-radius:26px;border:1px solid rgba(255,255,255,.1);display:grid;place-items:center;background:linear-gradient(180deg,#23374c 0%,#162430 100%);font-family:"Fraunces",Georgia,serif;font-size:5rem;color:#f7deb2}
    .copy-card{padding:28px 30px}.eyebrow{display:inline-flex;align-items:center;padding:8px 12px;border-radius:999px;background:rgba(214,163,89,.14);border:1px solid rgba(214,163,89,.24);color:#f7deb2;font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
    h1{margin:16px 0 12px;font-family:"Fraunces",Georgia,serif;font-size:clamp(2.8rem,4.6vw,5.2rem);line-height:.98;color:#fff8ee}
    .role{font-size:1.15rem;color:#d7d9de;margin-bottom:18px}.quote{font-family:"Fraunces",Georgia,serif;font-size:clamp(1.65rem,2.7vw,2.6rem);line-height:1.28;color:#f8f3ea}
    .meta{margin-top:18px;color:var(--muted);font-size:1rem}.progress{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;flex:1 1 240px}.bar{height:100%;width:0;background:linear-gradient(90deg,#d6a359 0%,#b67635 100%);transition:width .2s linear}
    .empty{display:grid;place-items:center;height:100%;text-align:center}.empty .copy-card{max-width:720px}
    @media (max-width:980px){.screen{padding:18px 18px 16px}.stage{grid-template-columns:1fr;gap:18px}.frame{min-height:36vh}.portrait,.portrait-placeholder{width:min(100%,340px);margin:0 auto}.top,.bottom{flex-wrap:wrap}.wc-badge img{width:min(140px,38vw)}.bk-badge img{width:min(200px,54vw)}}
  </style>
</head>
<body>
  <main class="screen">
    <div class="top">
      <div class="brand-group">
        <div class="brand">Margie Tribute Display</div>
        <div class="partner-lockup" aria-label="UConn Writing Center and Boss Key partnership">
          <div class="partner-badge wc-badge">
            <img src="./assets/logos/brand/uconn-writing-center-logo-transparent.png" alt="UConn Writing Center logo">
          </div>
          <div class="partner-x" aria-hidden="true">x</div>
          <div class="partner-badge bk-badge">
            <img src="./assets/logos/brand/boss-key-wordmark-refined.svg" alt="Boss Key logo">
          </div>
        </div>
      </div>
      <div class="counter" id="counter">Waiting for approved entries...</div>
    </div>

    <section id="stage" class="stage empty">
      <div class="copy-card">
        <span class="eyebrow">Approval feed</span>
        <h1>No approved entries yet</h1>
        <p class="role">Once approved notes are published from the review console, they will loop here automatically.</p>
      </div>
    </section>

    <div class="bottom">
      <div class="progress"><div class="bar" id="bar"></div></div>
      <div class="hint">Arrow keys move manually. The sequence loops automatically.</div>
    </div>
  </main>

  <script>
    (function(){
      const FEED_URL="./data/writing-center-tribute-display.json";
      const stage=document.getElementById("stage");
      const counter=document.getElementById("counter");
      const bar=document.getElementById("bar");
      const advanceMs=12000;
      let items=[];
      let index=0;
      let intervalId=null;
      let progressId=null;
      let progressStart=0;

      function resetProgress(){
        if(progressId)window.clearInterval(progressId);
        bar.style.width="0%";
        progressStart=Date.now();
        progressId=window.setInterval(function(){
          const elapsed=Date.now()-progressStart;
          bar.style.width=Math.min(100,(elapsed/advanceMs)*100)+"%";
        },120);
      }

      function renderEmpty(message){
        stage.className="stage empty";
        stage.innerHTML='<div class="copy-card"><span class="eyebrow">Approval feed</span><h1>No approved entries yet</h1><p class="role">'+message+"</p></div>";
        counter.textContent="Waiting for approved entries...";
        bar.style.width="0%";
      }

      function renderCurrent(){
        if(!items.length){renderEmpty("Once approved notes are published from the review console, they will loop here automatically.");return}
        const item=items[index];
        const portrait=item.selfieUrl?'<img class="portrait" src="'+item.selfieUrl+'" alt="'+(item.name||"Approved contributor")+'">':'<div class="portrait-placeholder">'+(item.name?item.name.charAt(0).toUpperCase():"M")+'</div>';
        stage.className="stage";
        stage.innerHTML='<div class="visual"><div class="frame">'+portrait+'</div></div><div class="copy"><div class="copy-card"><span class="eyebrow">Approved tribute</span><h1>'+(item.name||"Writing Center Alum")+'</h1><p class="role">'+([item.roleOrg,item.graduationYear?("Class of "+item.graduationYear):""].filter(Boolean).join(" | ")||"Writing Center community")+'</p><div class="quote">"'+(item.note||"")+'"</div><p class="meta">'+(item.hasVideo?"Submitted with a video or video link as part of the tribute.":"Approved for the reception display.")+"</p></div></div>";
        counter.textContent=(index+1)+" of "+items.length;
        resetProgress();
      }

      function advance(delta){
        if(!items.length)return;
        index=(index+delta+items.length)%items.length;
        renderCurrent();
      }

      function startLoop(){
        if(intervalId)window.clearInterval(intervalId);
        intervalId=window.setInterval(function(){advance(1)},advanceMs);
        resetProgress();
      }

      async function loadFeed(){
        try{
          const response=await fetch(FEED_URL+"?t="+Date.now());
          const result=await response.json();
          items=Array.isArray(result.items)?result.items:[];
          if(!items.length){renderEmpty("Once approved notes are published from the review console, they will loop here automatically.");return}
          index=index>=items.length?0:index;
          renderCurrent();
          startLoop();
        }catch(_error){
          renderEmpty("The display feed could not be loaded.");
        }
      }

      window.addEventListener("keydown",function(event){
        if(event.key==="ArrowRight"){advance(1);startLoop()}
        if(event.key==="ArrowLeft"){advance(-1);startLoop()}
      });

      loadFeed();
      window.setInterval(loadFeed,30000);
    })();
  </script>
</body>
</html>
