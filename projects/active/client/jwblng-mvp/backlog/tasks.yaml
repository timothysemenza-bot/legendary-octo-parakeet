meta:
  project: JWBLNG Kajabi Ops Agent
  engagement: JWBLNG donated constrained MVP
  source_docs:
    - projects/active/client/jwblng-mvp/JWBLNG-Donated-Scope-One-Pager.md
    - projects/active/client/jwblng-mvp/transcripts/meeting-2026-02-26-notes-action-plan.md
  timeline_weeks: 3
  owners:
    implementation: Timmy Semenza
    client_ops:
      - Jessica
      - Marcy

tasks:
  - id: OPS-001
    title: Validate platform access and MFA operating window
    phase: Week 1
    priority: P0
    owner: Timmy
    description: Confirm Kajabi, DNS, Zeffy, and Zoom access plus who handles MFA approvals.
    dependencies: []
    acceptance_criteria:
      - Operator account can access Kajabi Website, Products/Community, Events, Marketing, People, and Settings.
      - MFA code handoff process is documented with a daily overlap window.
      - Missing access (if any) is logged with owner and ETA.
    deliverables:
      - Access matrix and blocker log

  - id: OPS-002
    title: Baseline current-state audit
    phase: Week 1
    priority: P0
    owner: Timmy
    description: Capture current page map, join flow, tags/segments, offers, automations, and DNS baseline before edits.
    dependencies:
      - OPS-001
    acceptance_criteria:
      - Kajabi admin surfaces are captured with screenshots.
      - Current join URL and top navigation are documented.
      - Existing tags, offers, and automations are exported or recorded.
      - DNS baseline records are captured prior to any launch changes.
    deliverables:
      - Audit packet in projects/active/client/jwblng-mvp/playwright/artifacts

  - id: OPS-003
    title: Lock canonical member journey
    phase: Week 1
    priority: P0
    owner: Timmy
    description: Define and approve one canonical flow: discover -> join -> onboard -> first event -> ongoing updates.
    dependencies:
      - OPS-002
    acceptance_criteria:
      - Journey map includes one public join path and one onboarding path.
      - Entry points from homepage, events, and emails are consistent.
      - Client approves the journey and CTA language in writing.
    deliverables:
      - Member Journey Blueprint (one-page)

  - id: OPS-004
    title: Rework navigation and homepage CTA structure
    phase: Week 1
    priority: P1
    owner: Timmy
    description: Simplify public navigation and align all primary CTAs to canonical join and event paths.
    dependencies:
      - OPS-003
    acceptance_criteria:
      - Top nav reflects approved information architecture.
      - Homepage has one primary join CTA and one clear events CTA.
      - No dead-end links or duplicate join paths remain.
    deliverables:
      - Updated Kajabi nav and homepage configuration

  - id: OPS-005
    title: Build canonical join page and onboarding entry
    phase: Week 2
    priority: P0
    owner: Timmy
    description: Create a single join page and onboarding handoff experience for free community access.
    dependencies:
      - OPS-004
    acceptance_criteria:
      - Canonical join URL is live and linked from homepage/events/email templates.
      - Join page captures required contact fields and segmentation intent.
      - Successful submission routes to a clear next step page.
    deliverables:
      - Join page and onboarding entry flow

  - id: OPS-006
    title: Standardize event publishing template
    phase: Week 2
    priority: P1
    owner: Timmy
    description: Configure repeatable event setup with required fields, visibility rules, and RSVP/reminder flow.
    dependencies:
      - OPS-003
    acceptance_criteria:
      - Event template enforces title/date-time/timezone/description/RSVP link.
      - Visibility rules are documented for community vs insider access.
      - Reminder workflow exists and is test-sent internally.
    deliverables:
      - Event operations template

  - id: OPS-007
    title: Implement communication starter pack
    phase: Week 2
    priority: P1
    owner: Timmy
    description: Build welcome, reminder, and monthly digest templates with audience segmentation.
    dependencies:
      - OPS-005
    acceptance_criteria:
      - Three templates exist and are approved for tone and links.
      - Audience segment selection is explicit per template.
      - Internal seed tests pass link, rendering, and copy checks.
    deliverables:
      - Welcome template
      - Event reminder template
      - Monthly digest template

  - id: OPS-008
    title: Configure donation CTA path with Zeffy
    phase: Week 2
    priority: P1
    owner: Timmy
    description: Integrate one donation path from onboarding and events with clear user expectations.
    dependencies:
      - OPS-005
    acceptance_criteria:
      - Donation CTA is present on onboarding and at least one event surface.
      - CTA behavior (embed vs external) matches approved client decision.
      - Path is tested end-to-end without broken redirects.
    deliverables:
      - Donation CTA path and test notes

  - id: OPS-009
    title: Execute QA automation and manual UAT
    phase: Week 3
    priority: P0
    owner: Timmy
    description: Run local Playwright audit/journey checks and client user acceptance tests.
    dependencies:
      - OPS-006
      - OPS-007
      - OPS-008
    acceptance_criteria:
      - Playwright audit and journey tests run with saved artifacts.
      - Manual UAT verifies join, login recovery, RSVP, and email reminder flow.
      - Defects are logged and triaged before launch decision.
    deliverables:
      - QA log
      - Test artifacts

  - id: OPS-010
    title: Launch readiness and cutover checklist
    phase: Week 3
    priority: P0
    owner: Timmy
    description: Prepare and execute launch checklist for domain routing and operational handoff.
    dependencies:
      - OPS-009
    acceptance_criteria:
      - Go/no-go checklist is completed and approved.
      - Rollback plan is documented for critical launch steps.
      - Launch window and responsible approvers are confirmed.
    deliverables:
      - Launch checklist
      - Rollback checklist

  - id: OPS-011
    title: Admin SOP handoff and sign-off
    phase: Week 3
    priority: P0
    owner: Timmy
    description: Deliver operator runbook walkthrough and confirm client team can run core workflows.
    dependencies:
      - OPS-010
    acceptance_criteria:
      - Handoff session completed with Jessica and Marcy.
      - Team can execute approve/reject contact, publish event, and send updates unassisted.
      - Final sign-off recorded with open issues list (if any).
    deliverables:
      - Updated runbook
      - Handoff recording/notes

non_goals:
  - Full Kajabi migration or complete platform rebuild in Phase 1
  - Custom backend or CRM development
  - Unlimited revision cycles
  - Ongoing admin management after handoff
